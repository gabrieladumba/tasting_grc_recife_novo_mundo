<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#93013c">
<title>Grand Cru — Vinhos do Novo Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--mag:#93013c;--mag2:#b81f57;--cream:#fbf6ef;--ink:#241c17;--muted:#8a7d74;--line:#ece2d7;--dark:#221a22}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Poppins',-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
.top{position:sticky;top:0;z-index:20;background:rgba(251,246,239,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:12px}
.brand{font-family:Georgia,'Times New Roman',serif;color:var(--mag);font-weight:700;font-size:22px;line-height:1}
.top .sub{color:var(--muted);font-size:12px;letter-spacing:1px;text-transform:uppercase}
.back{margin-left:auto;background:#fff;border:1px solid var(--mag);color:var(--mag);border-radius:20px;padding:8px 16px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;display:none}
.wrap{max-width:1080px;margin:0 auto;padding:20px 18px 60px}
/* índice */
.h1{font-size:22px;font-weight:800;color:var(--ink);margin:6px 0 2px}
.h1 span{color:var(--mag)}
.lead{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(120,40,60,.13)}
.thumb{height:200px;background:#fcf7f0;display:flex;align-items:center;justify-content:center}
.thumb img{max-height:186px;max-width:90%}
.cbody{padding:12px 14px 16px}
.cprod{color:var(--mag);font-size:11px;font-weight:700;letter-spacing:.8px}
.cname{font-size:14.5px;font-weight:600;line-height:1.25;margin:3px 0 8px;min-height:36px}
.ctags{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:#f4e9ee;color:#7a2246;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600}
/* ficha */
.sheet{display:none;background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px 32px;box-shadow:0 12px 40px rgba(90,40,30,.08);position:relative}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:1px solid var(--line);padding-bottom:16px}
.stitle{font-size:30px;font-weight:800;line-height:1.08;color:var(--ink);margin:0}
.ssub{color:var(--muted);font-style:italic;font-size:15px;margin:8px 0 0;max-width:60ch}
.sbadge{flex:none;text-align:right}
.sbadge .pl{color:var(--mag);font-weight:800;font-size:16px;letter-spacing:.5px;line-height:1.1}
.sbadge .pk{color:var(--muted);font-size:10px;letter-spacing:2px;text-transform:uppercase}
.sthumb{width:54px;height:70px;object-fit:contain;display:block;margin:6px 0 0 auto}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:26px 40px;margin:22px 0 6px}
.field{display:flex;gap:12px;margin-bottom:18px}
.ic{flex:none;width:26px;height:26px;color:var(--mag);font-size:18px;line-height:26px;text-align:center}
.fl{font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--mag);text-transform:uppercase}
.fv{font-size:14.5px;color:#3a302a;line-height:1.45;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 20px}
.chip{background:#f1e6ec;color:#7a2246;border-radius:22px;padding:7px 16px;font-size:13px;font-weight:600}
.argbox{background:var(--dark);color:#fff;border-radius:14px;padding:16px 20px}
.argbox .al{color:#e7b7cd;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.argbox .av{font-size:15px;line-height:1.5}
.ontrade{margin-top:14px;background:#f6eef1;border-radius:10px;padding:12px 16px;font-size:13.5px;color:#5a4a52}
.ontrade b{color:var(--mag);letter-spacing:1px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px}
.navbtn{background:var(--mag);color:#fff;border:none;border-radius:12px;padding:12px 20px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
.navbtn.ghost{background:#fff;color:var(--mag);border:1.5px solid var(--mag)}
.navbtn:disabled{opacity:.35;cursor:default}
.pos{color:var(--muted);font-size:13px}
@media(max-width:720px){
  .wrap{padding:16px 14px 50px}
  .sheet{padding:22px 18px;border-radius:16px}
  .stitle{font-size:24px}.ssub{font-size:14px}
  .cols{grid-template-columns:1fr;gap:0;margin:18px 0 4px}
  .thumb{height:180px}
}
.spec{margin-top:8px;display:flex;flex-direction:column;gap:5px}.sp{display:grid;grid-template-columns:18px 60px 1fr;gap:6px;align-items:baseline;font-size:12px;line-height:1.3}.sp i{font-style:normal}.sp b{color:var(--mag);font-weight:600;font-size:10px;letter-spacing:.3px;text-transform:uppercase}.sp u{text-decoration:none;color:#4a3f38}
@media(max-width:640px){.top{padding:10px 14px}.brand{font-size:19px}.wrap{padding:14px 12px 46px}.grid{grid-template-columns:1fr;gap:12px}.thumb{height:184px}.thumb img{max-height:170px}.cname{min-height:0;font-size:15px}.sheet{padding:18px 15px;border-radius:16px}.shead{flex-direction:column}.stitle{font-size:22px}.ssub{font-size:13.5px}.sbadge{text-align:left;display:flex;align-items:center;gap:10px;margin-top:6px}.sbadge .sthumb{margin:0;width:40px;height:52px}.cols{grid-template-columns:1fr;gap:0;margin:16px 0 2px}.field{margin-bottom:15px}.argbox{padding:14px 16px}.argbox .av{font-size:14px}.nav{flex-wrap:wrap;gap:8px}.navbtn{flex:1;padding:12px 10px;font-size:13px}.pos{order:-1;width:100%;text-align:center;margin-bottom:2px}}
</style>
</head>
<body>

</div>

const grid=document.getElementById('grid'), sheet=document.getElementById('sheet'), index=document.getElementById('index'), back=document.getElementById('back');
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
grid.innerHTML=WINES.map((w,i)=>`<div class="card" onclick="openSheet(${i})">
  <div class="thumb">${w.img?`<img src="${w.img}" alt="">`:'🍷'}</div>
  <div class="cbody"><div class="cprod">${esc(w.prod)}</div><div class="cname">${esc(w.t)}</div>
  <div class="spec"><div class="sp"><i>🍇</i><b>Uva</b><u>${esc(w.uva)}</u></div><div class="sp"><i>🛢️</i><b>Vinif.</b><u>${esc(w.vinCurto)}</u></div><div class="sp"><i>👃</i><b>Olfativo</b><u>${esc(w.olfCurto)}</u></div><div class="sp"><i>🍋</i><b>Acidez</b><u>${esc(w.acidez)}</u></div><div class="sp"><i>🍷</i><b>Taninos</b><u>${esc(w.taninos)}</u></div></div></div></div>`).join('');
function field(ic,l,v){return `<div class="field"><div class="ic">${ic}</div><div><div class="fl">${l}</div><div class="fv">${esc(v)}</div></div></div>`;}
function openSheet(i){
  const w=WINES[i];
  sheet.innerHTML=`
   <div class="shead">
     <div><h1 class="stitle">${esc(w.t)}</h1><div class="ssub">${esc(w.sub)}</div></div>
     <div class="sbadge"><div class="pl">${esc(w.prod)}</div><div class="pk">Produtor</div>${w.img?`<img class="sthumb" src="${w.img}">`:''}</div>
   </div>
   <div class="cols">
     <div>
       ${field('📍','Região',w.reg)}
       ${field('🍇','Uva',w.uva)}
       ${field('🍷','Graduação alcoólica',w.alc)}
       ${field('🛢️','Vinificação',w.vin)}
     </div>
     <div>
       ${field('👃','Olfativo',w.olf)}
       ${field('👅','Gustativo',w.gus)}
       ${field('🍴','Harmonização',w.har)}
     </div>
   </div>
   <div class="chips">${w.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>
   <div class="argbox"><div class="al">Argumento de vendas</div><div class="av">${esc(w.arg)}</div></div>
   <div class="ontrade"><b>ON-TRADE</b> &nbsp;·&nbsp; ${esc(w.on)}</div>
   <div class="nav">
     <button class="navbtn ghost" onclick="openSheet(${(i-1+WINES.length)%WINES.length})">‹ Anterior</button>
     <span class="pos">${i+1} / ${WINES.length}</span>
     <button class="navbtn" onclick="openSheet(${(i+1)%WINES.length})">Próximo ›</button>
   </div>`;
  index.style.display='none'; sheet.style.display='block'; back.style.display='inline-block';
  window.scrollTo(0,0);
}
function goIndex(){sheet.style.display='none'; index.style.display='block'; back.style.display='none'; window.scrollTo(0,0);}
back.onclick=goIndex; window.openSheet=openSheet;
</script>
